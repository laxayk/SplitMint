spring.application.name=splitmint-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitmint}
spring.datasource.username=${DB_USER:splitmint}
spring.datasource.password=${DB_PASSWORD:splitmint}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:change-me-in-env-this-is-a-dev-only-secret-key-0123456789}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:1440}
server.port=${PORT:8080}
